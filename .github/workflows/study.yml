name: Run study

on:
  push:
    branches: [main]
    paths-ignore:
      - "reth_study/**"
      - "results/**"
      - "README.md"
      - "analysis/**"
      - "tests/test_holders.py"
      - ".github/workflows/holders.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"   # Sundays 06:17 UTC: add the new week

permissions:
  contents: write

concurrency:
  group: study
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Offline test on a synthetic market
        run: python tests/test_notebook_v2.py

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Execute the notebook on live data
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
        run: |
          mkdir -p results
          jupyter nbconvert --to notebook --execute reth_study_v2.ipynb \
            --output-dir results --output reth_study_v2_executed.ipynb \
            --ExecutePreprocessor.timeout=3600
      - name: Commit data and results
        if: always()
        run: |
          git config user.name "Nishikawa"
          git config user.email "130159335+NishikawaButterfly@users.noreply.github.com"
          git add reth_study results 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Update study data and results [skip ci]"
            git pull --rebase
            git push
          fi
